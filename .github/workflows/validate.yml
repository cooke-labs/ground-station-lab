name: Validate infrastructure

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-13
        with:
          persist-credentials: false
      - name: Compile with pinned, checksum-verified Bicep
        shell: pwsh
        run: ./scripts/Test-LabBicep.ps1
